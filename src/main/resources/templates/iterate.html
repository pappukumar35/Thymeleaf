<!doctype html>
<html lang="en xmlns:th=http//www.thmeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Document</title>
</head>
<body>
	<h1>starting the element of the looping system</h1>
	<h2 th:text="${names}"></h2>
	
	<ul>
	   <li th:each="n,status:${names}">
	   <span th:style="${status.odd} ? 'color:red; font-weight:bold':' ' "  th:text="${status.index+1}+' '+${n}"></span>
	   </li>
	</ul>
	
</body> 
</html>
