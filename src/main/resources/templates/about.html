<!doctype html>
<html lang="en" xmlns:th="http//www.thmeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Document</title>
</head>
<body>
	<h1>lear code with pappu kumar</h1>
	<h1>we are learning the spring code</h1>
	
	<h1 th:text="${name}"></th:>></h1>
	<h1 th:text="${#strings.toUpperCase(name)}"></h1>
	<h1>length of the name is=<span th:text="${#strings.length(name)}"></span></h1>
	<h1 th:text="${currentDate}"></h1>
	<h2>i'm learning something daily new technology for increasing the knowledge</h2>
	
	<div th:with="a=5, b=20,n=${name}">
	 <h1>value of a=<span th:text="${a}"></span></h1>
	 <h1>value of b=<span th:text="${b}"></span></h1>
	 <h1>value of n is=<span th:text="${n}"></span></h1>
	 <h2 th:text="'sum of '+${a}+'and'+${b}+'is '+${a+b}"></h2>
	</div>
	
</body>
</html>
